name = "dujiecode"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 345 CF 账号（3450211748@qq.com，f608546bec281f207409d11f3be5c89d）
# 2026-10-20 起主账号；旧 dujie_nb 账号（83839c2e49b7e273cf56aa66fe5aed51）弃用
account_id = "f608546bec281f207409d11f3be5c89d"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 主域自定义域名（345 账号 520691.xyz zone，Cloudflare 自动管理 DNS 与 TLS）
routes = [
  { pattern = "dujie_cone.520691.xyz", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "dujiecode-db"
database_id = "PENDING_345_D1_ID"

[[kv_namespaces]]
binding = "KV"
id = "PENDING_345_KV_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "dujiecode-files"

[[durable_objects.bindings]]
name = "TERMINAL_ROOM"
class_name = "TerminalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TerminalRoom"]

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://dujie_cone.520691.xyz"
MAX_AGENT_ROUNDS = "25"
SSE_KEEPALIVE_SEC = "15"

# 国内镜像地址（§12-D2）：落地页「访问入口」向国内访客提示用；
# 不做服务端跳转（访问本 Worker 不跳转）。可切换为 Gitee Pages：
# CN_MIRROR_URL = "https://dujie_nb_admin.gitee.io/dujiecode"
CN_MIRROR_URL = "https://gjsvip.github.io/"

# 多镜像 CORS 白名单（逗号分隔）：静态镜像站上的页面可跨源调用公开接口。
# 覆盖 520691.xyz 域名体系（主域/官网/博客）+ GitHub Pages + CF Pages + Gitee Pages。
CORS_ORIGINS = "https://dujie_cone.520691.xyz,https://www.520691.xyz,https://blog.520691.xyz,https://gjsvip.github.io,https://dujiecode.pages.dev,https://dujie_nb_admin.gitee.io"

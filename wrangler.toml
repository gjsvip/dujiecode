name = "dujiecode"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dujiecode-db"
database_id = "52f270d9-1d75-41bc-9df1-95264224e91e"

[[kv_namespaces]]
binding = "KV"
id = "e8664fb54b174330be46abad29727a31"

[[r2_buckets]]
binding = "R2"
bucket_name = "dujiecode-files"

[[durable_objects.bindings]]
name = "TERMINAL_ROOM"
class_name = "TerminalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TerminalRoom"]

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://dujiecode.dujie-nb.workers.dev"
MAX_AGENT_ROUNDS = "25"
SSE_KEEPALIVE_SEC = "15"

# 国内外分流（§12-D2）：国内访客访问官网根路径时 302 到国内镜像。
# 当前指向 GitHub Pages（国内可达、免实名）；Gitee Pages 启用后改为：
# CN_MIRROR_URL = "https://dujie_nb_admin.gitee.io/dujiecode"
CN_MIRROR_URL = "https://gjsvip.github.io/dujiecode/"

# 多镜像 CORS 白名单（逗号分隔）：静态镜像站上的页面可跨源调用公开接口。
# Gitee Pages 启用后将其 origin 追加至此（如 ,https://dujie_nb_admin.gitee.io）。
CORS_ORIGINS = "https://gjsvip.github.io,https://dujiecode.pages.dev,https://dujie_nb_admin.gitee.io"

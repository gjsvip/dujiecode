# 渡劫code 提交后自动镜像到 Gitee（数据互通：GitHub 为主仓库，Gitee 自动同步）
#
# 配置方法（仓库 Settings > Secrets and variables > Actions）：
#   GITEE_USER   = 你的 Gitee 用户名
#   GITEE_TOKEN  = Gitee 个人访问令牌（用户设置 > 私人令牌，勾选 projects 权限）
# 未配置以上 Secret 时本工作流的镜像步骤自动跳过（不报失败）。
name: mirror-to-gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_USER / GITEE_TOKEN，跳过 Gitee 镜像（配置后自动生效）"
            exit 0
          fi
          # 移除 origin 跟踪引用，避免推送 refs/remotes/* 被 Gitee 拒绝
          git remote remove origin || true
          git remote add gitee "https://$GITEE_USER:$GITEE_TOKEN@gitee.com/$GITEE_USER/dujiecode.git"
          # 只同步 main 与 gh-pages（Gitee Pages 国内镜像部署分支）。
          # 不用 --mirror：完整镜像会删除 Gitee 侧 Pages 部署所需的 gh-pages 分支，
          # 且 Gitee 仓库开启 Pages 服务后该分支必须常驻。
          git push --force gitee main:main
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git push --force gitee origin/gh-pages:gh-pages
          else
            echo "仓库无 gh-pages 分支，跳过（由 deploy.yml 的 deploy-gitee-source job 生成）"
          fi
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: 0

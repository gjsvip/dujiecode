name: Deploy to Cloudflare

# 同步部署：push 到 main 或手动触发时，自动构建并部署
#   - D1 数据库初始化（幂等，IF NOT EXISTS）
#   - Worker（dujiecode.dujie-nb.workers.dev，不跳转、直接服务）
#   - Pages 官网（dujiecode.pages.dev）
#   - 官网主域（gjsvip.github.io，干净域名无路径）
#
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CF_API_TOKEN        Cloudflare API Token（需 Workers/D1/Pages 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
#   SITE_DEPLOY_TOKEN   有 repo 权限的 PAT（推送主域仓库 gjsvip/gjsvip.github.io）
#   （GITEE_USER / GITEE_TOKEN 供镜像工作流使用，本仓库已配置）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Init D1 database (idempotent)
        run: npx wrangler d1 execute dujiecode-db --file=schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages project exists
        run: npx wrangler pages project create dujiecode --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages (official site + agent script)
        run: npx wrangler pages deploy dist --project-name dujiecode --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### 部署完成 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 目标 | 地址 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker API | https://dujiecode.dujie-nb.workers.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages 官网 | https://dujiecode.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

  # 官网主域（§12-D2）：发布到用户站点 gjsvip.github.io（干净域名无路径）。
  # base=/ 同根构建，CTA 绝对链接指向 Worker 工作台。
  deploy-user-site:
    name: Deploy 主域 gjsvip.github.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base=/)
        run: |
          npx tsc --noEmit
          VITE_APP_URL=https://dujiecode.dujie-nb.workers.dev npx vite build

      - name: Publish to gjsvip.github.io (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: gjsvip/gjsvip.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: 渡劫code 官网 ${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "### 主域已部署 :earth_asia:"
            echo ""
            echo "- 地址：https://gjsvip.github.io （干净域名，国内外可达）"
            echo "- 博客：https://gjsvip.github.io/blog/"
          } >> $GITHUB_STEP_SUMMARY

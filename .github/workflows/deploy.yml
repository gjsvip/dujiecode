name: Deploy to Cloudflare

# 同步部署：push 到 main 或手动触发时，自动构建并部署
#   - D1 数据库初始化（幂等，IF NOT EXISTS）
#   - Worker（345 账号 dujiecode，自定义域名 dujie_cone.520691.xyz，不跳转、直接服务）
#   - Pages 官网（345 账号 dujiecode.pages.dev）
#   - GitHub Pages 镜像（gjsvip.github.io，国内可达）
#
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CF_API_TOKEN        Cloudflare API Token（345 账号，需 Workers/D1/Pages 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID（345 账号 f608546bec281f207409d11f3be5c89d）
#   SITE_DEPLOY_TOKEN   有 repo 权限的 PAT（推送 GitHub Pages 镜像仓库 gjsvip/gjsvip.github.io）
#   （GITEE_USER / GITEE_TOKEN 供镜像工作流使用，本仓库已配置）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Init D1 database (idempotent)
        run: npx wrangler d1 execute dujiecode-db --file=schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages project exists
        run: npx wrangler pages project create dujiecode --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages (official site + agent script)
        run: npx wrangler pages deploy dist --project-name dujiecode --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### 部署完成 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 目标 | 地址 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 渡劫code 主域 | https://dujie_cone.520691.xyz |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages 官网 | https://dujiecode.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

  # GitHub Pages 镜像（§12-D2）：发布到用户站点 gjsvip.github.io（国内可达镜像）。
  # base=/ 同根构建，CTA 绝对链接指向渡劫code 主域 dujie_cone.520691.xyz。
  deploy-user-site:
    name: Deploy GitHub Pages 镜像 gjsvip.github.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base=/)
        run: |
          npx tsc --noEmit
          VITE_APP_URL=https://dujie_cone.520691.xyz npx vite build

      - name: Publish to gjsvip.github.io (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: gjsvip/gjsvip.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: 渡劫code 官网 ${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "### GitHub Pages 镜像已部署 :earth_asia:"
            echo ""
            echo "- 地址：https://gjsvip.github.io （国内可达的 GitHub Pages 镜像）"
            echo "- 渡劫code 主域：https://dujie_cone.520691.xyz"
            echo "- 个人官网：https://www.520691.xyz"
            echo "- 博客：https://blog.520691.xyz"
          } >> $GITHUB_STEP_SUMMARY
